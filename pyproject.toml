[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "volleyball-engineering-lab"
version = "0.1.0"
description = "Computational engineering study of indoor volleyball architecture."
requires-python = ">=3.11"

dependencies = [
    "cadquery==2.8.0",
    "gmsh==4.15.2",
    "numpy==2.4.6; python_version == '3.11'",
    "numpy==2.5.2; python_version >= '3.12'",
    "pyvista==0.48.4",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "ruff==0.16.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py311"
