[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "volleyball-engineering-lab"
version = "0.1.0"
description = "Computational engineering study of indoor volleyball architecture."
requires-python = ">=3.11"

dependencies = [
    "cadquery==2.8.0",
]
[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
